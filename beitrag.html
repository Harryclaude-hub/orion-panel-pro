<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orion Panel Pro — Beitrag</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="schrift/schrift.css?v=80">
<link rel="stylesheet" href="css/stil.css?v=80">
<link rel="stylesheet" href="css/hud.css?v=80">
<style>
  /* Die Beitragsseite zeigt GENAU EINE Karte — der Link aus der
   * Telegram-Meldung landet hier, ohne Suchen, ohne Reiter. */
  .beitrag-huelle { max-width: 900px; margin: 0 auto; padding: 18px 16px 60px; }
  .beitrag-kopf { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 18px; }
  .beitrag-kopf h1 { margin: 0; font-size: 22px; }
  .beitrag-kopf .luecke { flex: 1; }
  .beitrag-stand { border: 1px solid var(--rand); border-radius: 10px; padding: 12px 14px;
                   margin-bottom: 16px; font-size: 14px; color: var(--text-leise); }
  .beitrag-stand b { color: var(--text); }

  /* DER ZIELBLOCK (20.8.): wer aus einer Telegram-Meldung kommt, hat dort
   * auf ein bestimmtes Buch gedrueckt (?zu=1 oder ?zu=2). Statt ihn
   * ungefragt auf die Anbieterseite zu werfen, landet er HIER und bekommt
   * den Absprung als bewussten Klick, mit dem Kurs daneben, gegen den er
   * gerade prueft. Ohne ?zu bleibt der Block unsichtbar. */
  .zielblock { border: 1px solid var(--sonar); border-left: 3px solid var(--sonar);
               border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
               background: var(--karte); }
  .zielblock .ziel-kopf { font-size: 14px; color: var(--text-leise); margin-bottom: 10px; }
  .zielblock .ziel-kopf b { color: var(--text); }
  .zielblock .ziel-warn { font-size: 13px; color: var(--text-leise); margin-top: 10px; }
</style>
</head>
<body>

<div id="sperre">
  <div class="kasten">
    <h2>Orion Panel Pro</h2>
    <input id="sperrwort" type="password" placeholder="Wort" autocomplete="off">
    <button id="entsperren">Öffnen</button>
    <div class="fehler" id="sperrfehler"></div>
  </div>
</div>

<div class="beitrag-huelle">
  <header class="beitrag-kopf">
    <h1>Beitrag</h1>
    <span class="luecke"></span>
    <a class="knopf" href="gespeichert.html">★ Gespeichert</a>
    <a class="knopf" href="index.html">Zurück zum Panel</a>
  </header>

  <div id="stand" class="beitrag-stand">wird geladen …</div>
  <!-- Nur befuellt, wenn der Aufruf ein ?zu=1 / ?zu=2 mitbringt. -->
  <div id="zielblock"></div>
  <div id="karte"></div>
</div>

<script src="js/konfig.js?v=80"></script>
<script src="js/sperre.js?v=80"></script>
<script src="js/rechnung.js?v=80"></script>
<script src="js/zuordnung.js?v=80"></script>
<script src="js/filter.js?v=80"></script>
<script src="js/anzeige.js?v=80"></script>
<script src="js/speicher.js?v=80"></script>
<script>
(function () {
  'use strict';
  var K = window.KONFIG || {};

  function hole(pfad) {
    return fetch(K.supabase + '/rest/v1/' + pfad, {
      headers: { apikey: K.key, authorization: 'Bearer ' + K.key, accept: 'application/json' }
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function stand(text) { document.getElementById('stand').innerHTML = text; }

  /* Dieselben abgeleiteten Felder, die daten.js sonst anhaengt —
   * identisch zum Pruefstand karte-probe.html. */
  function ergaenze(f) {
    if (f.echter_gewinn === undefined) {
      f.echter_gewinn = (f.max_gewinn === null || f.max_gewinn === undefined)
        ? null : Number(f.max_gewinn);
    }
    if (f.zu_duenn === undefined) {
      f.zu_duenn = f.max_einsatz !== null && f.max_einsatz !== undefined &&
                   Number(f.max_einsatz) < (K.mindestEinsatz || 0);
    }
    return f;
  }

  /* Welcher Fund? ?fund=<schluessel> — derselbe Schluessel wie in der
   * Telegram-Meldung und in orion_funde. */
  var schluessel = null, zuBuch = null;
  try {
    var frage = new URLSearchParams(location.search);
    schluessel = frage.get('fund');
    /* ?zu=1 / ?zu=2 (20.8.): welches Buch wollte der Leser sehen, als er in
     * Telegram gedrueckt hat. Alles andere wird ignoriert statt geraten. */
    var z = frage.get('zu');
    if (z === '1' || z === '2') zuBuch = z;
  } catch (e) { /* alt */ }
  if (!schluessel) {
    stand('<b>Kein Fund angegeben.</b> Diese Seite erwartet ?fund=… — der Link aus der ' +
          'Telegram-Meldung bringt ihn mit. <a href="index.html">Zurück zum Panel</a>.');
    return;
  }

  /* EZB-Kurs setzen, damit die Betraege beide Waehrungen zeigen.
   * Laeuft erst NACH dem Entsperren (siehe ganz unten): vorher hat die
   * Seite nichts anzuzeigen, und eine Datenabfrage fuer jemanden ohne
   * Wort waere obendrein verschenkter Datenabfluss. */
  function holeKurs() {
    hole('orion_kurse?paar=eq.USD_EUR&select=kurs,stand,quelle&limit=1').then(function (z) {
      if (z && z[0]) window.Anzeige.setzeKurs(z[0]);
    }).catch(function () { /* ohne Kurs ehrlich in $ */ });
  }

  /* DER ZIELBLOCK. Nutzt buch1/buch2 aus anzeige.js, damit Buchname und
   * Broker-Umweg dieselbe Wahrheit tragen wie die Karte darunter. Zahlen
   * stehen bewusst NICHT hier drin: sie stehen zwei Zentimeter tiefer auf
   * der Karte, und zweimal dieselbe Zahl an zwei Stellen ist genau die
   * Sorte Doppelwahrheit, die hier schon Geld gekostet hat. */
  var zielGezeichnet = '';
  function zeichneZiel(f) {
    var kasten = document.getElementById('zielblock');
    if (!zuBuch) { if (zielGezeichnet !== '') { kasten.innerHTML = ''; zielGezeichnet = ''; } return; }

    var A = window.Anzeige || {};
    var info = (zuBuch === '1' ? A.buch1 : A.buch2);
    info = typeof info === 'function' ? info(f) : { name: zuBuch === '1' ? 'Buch 1' : 'Buch 2' };
    var url   = zuBuch === '1' ? f.pm_link  : f.bf_link;
    var seite = zuBuch === '1' ? f.pm_seite : f.bf_seite;
    var name  = String(info.name || '?');
    function sicher(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    var html = '<div class="zielblock">' +
      '<div class="ziel-kopf">Aus der Meldung gekommen: du wolltest zu <b>' + sicher(name) + '</b>' +
        (seite ? ', Seite <b>' + sicher(seite) + '</b>' : '') + '.</div>';

    if (url) {
      html += '<a class="knopf" target="_blank" rel="noopener" href="' + sicher(url) + '">' +
                sicher(info.ueberBroker ? (name + ' über Orbit öffnen') : (name + ' öffnen')) +
              '</a>';
    } else {
      html += '<span class="knopf gesperrt">' + sicher(name) + '-Link fehlt in diesem Fund</span>';
    }

    html += '<div class="ziel-warn">Der Absprung zum Anbieter ist bewusst ein eigener Klick: ' +
              'die Kurse unten sind der Stand von <b>jetzt</b> und laufen weiter. ' +
              'Erst hier prüfen, dann drüben setzen.</div>' +
            '</div>';

    if (html !== zielGezeichnet) { kasten.innerHTML = html; zielGezeichnet = html; }
  }

  var zuletzt = '';
  function lade() {
    hole('orion_funde?schluessel=eq.' + encodeURIComponent(schluessel) + '&limit=1').then(function (z) {
      if (!z || !z.length) {
        stand('<b>Diesen Fund gibt es nicht mehr in der Datenbank.</b> Er wurde aufgeräumt ' +
              'oder der Link ist alt. Vielleicht liegt er unter <a href="gespeichert.html">Gespeichert</a>.');
        return;
      }
      var f = ergaenze(z[0]);
      var live = f.status === 'live';
      stand((live ? 'Live — die Karte holt sich alle 5 Sekunden frische Zahlen.'
                  : '<b>Vorbei</b> — dieser Fund ist beendet (' + (f.vorbei_grund || 'kein Grund vermerkt') +
                    '). Die Karte zeigt den letzten Stand.') +
            ' &nbsp;·&nbsp; Schlüssel: <b>' + String(f.schluessel).replace(/</g, '&lt;') + '</b>');
      zeichneZiel(f);
      var neu = window.Anzeige.karte(f, !live);
      if (neu !== zuletzt) {
        document.getElementById('karte').innerHTML = neu;
        zuletzt = neu;
      }
    }).catch(function (e) {
      stand('<b>Nicht geladen:</b> ' + e.message + ' — <a href="index.html">zurück zum Panel</a>.');
    });
  }
  /* DAS KENNWORT-TOR STARTEN (21.8., Karams Fund).
   *
   * Diese Seite LUD sperre.js, rief aber nie Sperre.start() auf. Ohne den
   * Aufruf bekommt der Oeffnen-Knopf keinen Horcher: man tippt das Wort,
   * drueckt, und es passiert NICHTS. Kein Fehler, keine Meldung, keine
   * Reaktion. Das Overlay liegt dabei mit z-index 2147483647 ueber der
   * ganzen Seite und schluckt jeden Klick, auch den auf den Absprung
   * zum Anbieter.
   *
   * Besonders teuer war das hier, weil seit dem 20.8. JEDER Link aus
   * beiden Telegram-Bots auf diese Seite fuehrt. Der ganze Umbau lief
   * gegen eine verschlossene Tuer.
   *
   * Dieselbe Luecke hatte gespeichert.html. Vier Seiten (index ueber
   * app.js, einstellungen ueber einstellungen.js, knoepfe, logik) riefen
   * korrekt auf, zwei nicht. LEHRE: eine Datei zu LADEN heisst nicht,
   * sie zu BENUTZEN. Wer sperre.js einbindet, ruft auch Sperre.start(). */
  window.Sperre.start(function () {
    holeKurs();
    lade();
    /* 5-Sekunden-Takt fuer EINE Zeile — bewusst langsamer als das Panel
     * (2 s fuer alles): eine Einzelseite braucht keine Gefechtstakte. */
    setInterval(lade, 5000);
  });
})();
</script>
</body>
</html>
