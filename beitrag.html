<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orion Panel Pro — Beitrag</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="schrift/schrift.css?v=71">
<link rel="stylesheet" href="css/stil.css?v=71">
<link rel="stylesheet" href="css/hud.css?v=71">
<style>
  /* Die Beitragsseite zeigt GENAU EINE Karte — der Link aus der
   * Telegram-Meldung landet hier, ohne Suchen, ohne Reiter. */
  .beitrag-huelle { max-width: 900px; margin: 0 auto; padding: 18px 16px 60px; }
  .beitrag-kopf { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 18px; }
  .beitrag-kopf h1 { margin: 0; font-size: 22px; }
  .beitrag-kopf .luecke { flex: 1; }
  .beitrag-stand { border: 1px solid var(--rand); border-radius: 10px; padding: 12px 14px;
                   margin-bottom: 16px; font-size: 14px; color: var(--text-leise); }
  .beitrag-stand b { color: var(--text); }
</style>
</head>
<body>

<div id="sperre">
  <div class="kasten">
    <h2>Orion Panel Pro</h2>
    <input id="sperrwort" type="password" placeholder="Wort" autocomplete="off">
    <button id="entsperren">Öffnen</button>
    <div class="fehler" id="sperrfehler"></div>
  </div>
</div>

<div class="beitrag-huelle">
  <header class="beitrag-kopf">
    <h1>Beitrag</h1>
    <span class="luecke"></span>
    <a class="knopf" href="gespeichert.html">★ Gespeichert</a>
    <a class="knopf" href="index.html">Zurück zum Panel</a>
  </header>

  <div id="stand" class="beitrag-stand">wird geladen …</div>
  <div id="karte"></div>
</div>

<script src="js/konfig.js?v=71"></script>
<script src="js/sperre.js?v=71"></script>
<script src="js/rechnung.js?v=71"></script>
<script src="js/zuordnung.js?v=71"></script>
<script src="js/filter.js?v=71"></script>
<script src="js/anzeige.js?v=71"></script>
<script src="js/speicher.js?v=71"></script>
<script>
(function () {
  'use strict';
  var K = window.KONFIG || {};

  function hole(pfad) {
    return fetch(K.supabase + '/rest/v1/' + pfad, {
      headers: { apikey: K.key, authorization: 'Bearer ' + K.key, accept: 'application/json' }
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function stand(text) { document.getElementById('stand').innerHTML = text; }

  /* Dieselben abgeleiteten Felder, die daten.js sonst anhaengt —
   * identisch zum Pruefstand karte-probe.html. */
  function ergaenze(f) {
    if (f.echter_gewinn === undefined) {
      f.echter_gewinn = (f.max_gewinn === null || f.max_gewinn === undefined)
        ? null : Number(f.max_gewinn);
    }
    if (f.zu_duenn === undefined) {
      f.zu_duenn = f.max_einsatz !== null && f.max_einsatz !== undefined &&
                   Number(f.max_einsatz) < (K.mindestEinsatz || 0);
    }
    return f;
  }

  /* Welcher Fund? ?fund=<schluessel> — derselbe Schluessel wie in der
   * Telegram-Meldung und in orion_funde. */
  var schluessel = null;
  try { schluessel = new URLSearchParams(location.search).get('fund'); } catch (e) { /* alt */ }
  if (!schluessel) {
    stand('<b>Kein Fund angegeben.</b> Diese Seite erwartet ?fund=… — der Link aus der ' +
          'Telegram-Meldung bringt ihn mit. <a href="index.html">Zurück zum Panel</a>.');
    return;
  }

  /* EZB-Kurs setzen, damit die Betraege beide Waehrungen zeigen. */
  hole('orion_kurse?paar=eq.USD_EUR&select=kurs,stand,quelle&limit=1').then(function (z) {
    if (z && z[0]) window.Anzeige.setzeKurs(z[0]);
  }).catch(function () { /* ohne Kurs ehrlich in $ */ });

  var zuletzt = '';
  function lade() {
    hole('orion_funde?schluessel=eq.' + encodeURIComponent(schluessel) + '&limit=1').then(function (z) {
      if (!z || !z.length) {
        stand('<b>Diesen Fund gibt es nicht mehr in der Datenbank.</b> Er wurde aufgeräumt ' +
              'oder der Link ist alt. Vielleicht liegt er unter <a href="gespeichert.html">Gespeichert</a>.');
        return;
      }
      var f = ergaenze(z[0]);
      var live = f.status === 'live';
      stand((live ? 'Live — die Karte holt sich alle 5 Sekunden frische Zahlen.'
                  : '<b>Vorbei</b> — dieser Fund ist beendet (' + (f.vorbei_grund || 'kein Grund vermerkt') +
                    '). Die Karte zeigt den letzten Stand.') +
            ' &nbsp;·&nbsp; Schlüssel: <b>' + String(f.schluessel).replace(/</g, '&lt;') + '</b>');
      var neu = window.Anzeige.karte(f, !live);
      if (neu !== zuletzt) {
        document.getElementById('karte').innerHTML = neu;
        zuletzt = neu;
      }
    }).catch(function (e) {
      stand('<b>Nicht geladen:</b> ' + e.message + ' — <a href="index.html">zurück zum Panel</a>.');
    });
  }
  lade();
  /* 5-Sekunden-Takt fuer EINE Zeile — bewusst langsamer als das Panel
   * (2 s fuer alles): eine Einzelseite braucht keine Gefechtstakte. */
  setInterval(lade, 5000);
})();
</script>
</body>
</html>
